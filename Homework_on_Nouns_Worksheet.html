<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Homework on Nouns — বাংলায় IELTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap"
rel="stylesheet"
>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>

/* =========================================================
   THEME VARIABLES
========================================================= */

:root {
    --accent:#EE6983;
    --accent-strong:#D94F70;
    --ok:#2e8b57;
    --bad:#c0392b;
}


body[data-theme="light"] {

    --bg:#FCF5EE;
    --bg-soft:#FFF9F4;

    --text:#402028;
    --text-soft:#7a4a56;

    --heading:#850E35;

    --accent-soft:#FFC4C4;
    --border:#FFD9D9;

    --glass:
        rgba(255,255,255,.68);

    --glass-strong:
        rgba(255,255,255,.82);

    --task-glass:
        rgba(255,255,255,.58);

    --glass-border:
        rgba(255,255,255,.78);

    --field-bg:
        rgba(255,249,244,.88);

    --shadow:
        0 16px 40px
        rgba(133,14,53,.09);

    --shadow-hover:
        0 20px 48px
        rgba(133,14,53,.14);
}


body[data-theme="dark"] {

    --bg:#220812;
    --bg-soft:#33101F;

    --text:#FCEFEF;
    --text-soft:#E9B9C4;

    --heading:#FFC4C4;

    --accent-soft:#850E35;
    --border:#5C1A34;

    --glass:
        rgba(59,18,36,.62);

    --glass-strong:
        rgba(59,18,36,.78);

    --task-glass:
        rgba(69,21,41,.55);

    --glass-border:
        rgba(255,196,196,.12);

    --field-bg:
        rgba(42,10,22,.68);

    --ok:#6fcf97;
    --bad:#ff8a80;

    --shadow:
        0 18px 46px
        rgba(0,0,0,.32);

    --shadow-hover:
        0 22px 54px
        rgba(0,0,0,.42);
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing:border-box;
}


html {
    scroll-behavior:smooth;
}


body {

    margin:0;

    min-height:100vh;

    color:var(--text);

    font-family:
        'Hind Siliguri',
        sans-serif;

    font-size:17px;

    line-height:1.55;

    padding-bottom:86px;

    transition:
        background .35s ease,
        color .35s ease;


    background:

        radial-gradient(
            circle at 8% 5%,
            rgba(238,105,131,.18),
            transparent 27%
        ),

        radial-gradient(
            circle at 95% 30%,
            rgba(133,14,53,.10),
            transparent 28%
        ),

        var(--bg);

}


body[data-theme="dark"] {

    background:

        radial-gradient(
            circle at 8% 5%,
            rgba(238,105,131,.15),
            transparent 28%
        ),

        radial-gradient(
            circle at 92% 34%,
            rgba(133,14,53,.20),
            transparent 30%
        ),

        var(--bg);

}


button,
input,
select,
textarea {
    font-family:inherit;
}


h1,
h2,
h3,
.brand {

    font-family:
        'Baloo Da 2',
        cursive;

    color:var(--heading);

}


/* =========================================================
   PAGE WRAPPER
========================================================= */

.wrap {

    max-width:980px;

    margin:0 auto;

    padding:
        22px 18px;
}


/* =========================================================
   GLASS TOPBAR
========================================================= */

.topbar {

    position:sticky;

    top:0;

    z-index:50;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    padding:
        13px 20px;

    border-bottom:
        1px solid
        var(--glass-border);

    background:
        var(--glass);

    backdrop-filter:
        blur(18px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(140%);

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.05);
}


.brand {

    font-size:18px;

    font-weight:700;

    letter-spacing:.2px;
}


.theme-btn {

    border:
        1px solid
        var(--border);

    background:
        var(--glass-strong);

    color:
        var(--text);

    border-radius:999px;

    padding:
        10px 17px;

    cursor:pointer;

    font-size:15px;

    font-weight:700;

    backdrop-filter:
        blur(10px);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}


.theme-btn:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--accent);

    box-shadow:
        0 8px 22px
        rgba(238,105,131,.16);
}


/* =========================================================
   HEADER GLASS CARD
========================================================= */

.header-card {

    position:relative;

    overflow:hidden;

    padding:
        30px 28px;

    margin:
        22px 0
        28px;

    border-radius:24px;

    border:
        1px solid
        var(--glass-border);

    background:
        var(--glass);

    backdrop-filter:
        blur(22px)
        saturate(145%);

    -webkit-backdrop-filter:
        blur(22px)
        saturate(145%);

    box-shadow:
        var(--shadow);
}


.header-card::before {

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    top:-135px;
    right:-115px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(238,105,131,.22),
            transparent 68%
        );

    pointer-events:none;
}


.header-card h1 {

    position:relative;

    margin:
        0 0 5px;

    font-size:
        clamp(31px,5vw,40px);

    line-height:1.2;

    font-weight:800;
}


.subtitle {

    position:relative;

    color:
        var(--text-soft);

    font-size:17px;

    line-height:1.6;

    margin-bottom:22px;
}


/* =========================================================
   STUDENT DETAILS
========================================================= */

.meta-grid {

    position:relative;

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap:13px;
}


.meta-grid label {

    display:block;

    margin-bottom:6px;

    color:
        var(--text-soft);

    font-size:15px;

    font-weight:700;
}


.meta-grid input {

    width:100%;

    padding:
        11px 12px;

    border-radius:12px;

    border:
        1.5px solid
        var(--border);

    background:
        var(--field-bg);

    color:
        var(--text);

    font-size:16px;

    outline:none;

    transition:
        border-color .2s,
        box-shadow .2s;
}


.meta-grid input:focus {

    border-color:
        var(--accent);

    box-shadow:
        0 0 0 3px
        rgba(238,105,131,.12);
}


/* =========================================================
   GLASS SECTION CONTAINER
========================================================= */

.section-shell {

    position:relative;

    margin:
        30px 0;

    padding:
        24px;

    border-radius:26px;

    border:
        1px solid
        var(--glass-border);

    background:
        var(--glass);

    backdrop-filter:
        blur(20px)
        saturate(135%);

    -webkit-backdrop-filter:
        blur(20px)
        saturate(135%);

    box-shadow:
        var(--shadow);
}


.section-title {

    margin:
        0 0 5px;

    font-size:28px;

    line-height:1.25;

    font-weight:800;
}


.section-sub {

    color:
        var(--text-soft);

    font-size:16px;

    line-height:1.55;

    margin-bottom:22px;
}


/* =========================================================
   GLASS TASK CARDS
========================================================= */

.task {

    position:relative;

    overflow:hidden;

    padding:
        24px;

    margin-bottom:20px;

    border-radius:20px;

    border:
        1px solid
        var(--glass-border);

    background:
        var(--task-glass);

    backdrop-filter:
        blur(15px)
        saturate(135%);

    -webkit-backdrop-filter:
        blur(15px)
        saturate(135%);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.055);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}


.task:last-child {
    margin-bottom:0;
}


.task::before {

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    top:-105px;
    right:-90px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(238,105,131,.18),
            transparent 68%
        );

    pointer-events:none;
}


.task:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(238,105,131,.32);

    box-shadow:
        var(--shadow-hover);
}


.task-head {

    position:relative;

    display:flex;

    justify-content:
        space-between;

    align-items:flex-start;

    gap:14px;

    margin-bottom:12px;
}


.task-head h3 {

    margin:0;

    font-size:21px;

    line-height:1.35;

    font-weight:800;
}


.marks-pill {

    flex-shrink:0;

    background:
        var(--accent-soft);

    color:
        var(--heading);

    font-size:13.5px;

    font-weight:800;

    padding:
        6px 12px;

    border-radius:999px;
}


/* =========================================================
   BILINGUAL INSTRUCTION BOX
========================================================= */

.instruction-box {

    position:relative;

    margin:
        10px 0
        16px;

    padding:
        14px 16px;

    border-radius:14px;

    border:
        1px solid
        rgba(238,105,131,.16);

    background:
        rgba(238,105,131,.055);
}


.instr {

    font-size:16px;

    line-height:1.55;
}


.instr + .instr {

    margin-top:7px;
}


.instr-en {

    color:
        var(--text);
}


.instr-bn {

    color:
        var(--text-soft);

    font-weight:500;
}


.lang-label {

    display:inline-block;

    min-width:40px;

    margin-right:7px;

    color:
        var(--heading);

    font-size:12px;

    font-weight:800;

    letter-spacing:.5px;

    text-transform:uppercase;
}


/* =========================================================
   HINT
========================================================= */

.hint {

    margin-top:12px;

    padding:
        11px 13px;

    border-radius:11px;

    border-left:
        4px solid
        var(--accent);

    background:
        rgba(238,105,131,.075);

    color:
        var(--text-soft);

    font-size:14.5px;

    line-height:1.55;
}


/* =========================================================
   TABLES
========================================================= */

table.qtable {

    width:100%;

    border-collapse:
        separate;

    border-spacing:0;

    margin-top:14px;

    overflow:hidden;

    border-radius:12px;

    font-size:15.5px;
}


table.qtable th,
table.qtable td {

    border-right:
        1px solid
        var(--border);

    border-bottom:
        1px solid
        var(--border);

    padding:
        10px 11px;

    text-align:left;

    vertical-align:middle;
}


table.qtable th:first-child,
table.qtable td:first-child {

    border-left:
        1px solid
        var(--border);
}


table.qtable tr:first-child th {

    border-top:
        1px solid
        var(--border);
}


table.qtable th:first-child {

    border-top-left-radius:
        12px;
}


table.qtable th:last-child {

    border-top-right-radius:
        12px;
}


table.qtable th {

    background:
        rgba(238,105,131,.075);

    font-weight:700;
}


/* =========================================================
   INPUTS
========================================================= */

input[type=text],
select,
textarea {

    width:100%;

    padding:
        9px 11px;

    border-radius:10px;

    border:
        1.5px solid
        var(--border);

    background:
        var(--field-bg);

    color:
        var(--text);

    font-size:15.5px;

    outline:none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}


input[type=text]:focus,
select:focus,
textarea:focus {

    border-color:
        var(--accent);

    box-shadow:
        0 0 0 3px
        rgba(238,105,131,.11);
}


textarea {

    resize:vertical;

    min-height:72px;

    line-height:1.5;
}


/* =========================================================
   RADIO OPTIONS
========================================================= */

.radio-row {

    display:flex;

    gap:
        10px 16px;

    flex-wrap:wrap;

    margin-top:5px;
}


.radio-row label {

    display:flex;

    align-items:center;

    gap:6px;

    font-size:15px;

    cursor:pointer;
}


.radio-row input[type="radio"] {

    width:16px;
    height:16px;

    accent-color:
        var(--accent);
}


/* =========================================================
   GIVEN / EXAMPLE
========================================================= */

.given {
    opacity:.78;
}


.given input,
.given select {

    background:
        var(--accent-soft);

    font-weight:700;
}


/* =========================================================
   FREE ITEMS / PROMPTS
========================================================= */

.freeitem {

    padding:
        7px 0;

    margin-bottom:14px;
}


.freeitem:last-child {
    margin-bottom:0;
}


.freeitem .prompt {

    margin-bottom:7px;

    font-size:16px;

    line-height:1.55;
}


/* =========================================================
   RESULT TAGS
========================================================= */

.result-tag {

    display:inline-block;

    margin-left:7px;

    padding:
        3px 9px;

    border-radius:999px;

    font-size:12.5px;

    font-weight:800;
}


.tag-full {

    background:#d6f5df;

    color:
        var(--ok);
}


.tag-partial {

    background:#fff3cd;

    color:#8a6500;
}


.tag-zero {

    background:#ffe0e0;

    color:
        var(--bad);
}


[data-theme="dark"] .tag-full {

    background:#154a2c;
}


[data-theme="dark"] .tag-partial {

    background:#4a3c10;

    color:#ffd76b;
}


[data-theme="dark"] .tag-zero {

    background:#4a1414;
}


/* =========================================================
   SCORE GLASS CARD
========================================================= */

.score-banner {

    margin:
        30px 0;

    padding:
        26px;

    text-align:center;

    border-radius:22px;

    border:
        1px solid
        var(--glass-border);

    background:
        var(--glass);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        var(--shadow);
}


.score-banner .big {

    margin-top:4px;

    color:
        var(--heading);

    font-family:
        'Baloo Da 2',
        cursive;

    font-size:54px;

    font-weight:800;

    line-height:1.2;
}


.tracker {

    width:100%;

    border-collapse:
        collapse;

    margin-top:18px;

    font-size:15px;
}


.tracker th,
.tracker td {

    border:
        1px solid
        var(--border);

    padding:
        9px 10px;

    text-align:center;
}


.tracker th {

    background:
        rgba(238,105,131,.08);
}


/* =========================================================
   STICKY FOOTER ACTION BAR
========================================================= */

.footer-bar {

    position:sticky;

    bottom:0;

    z-index:40;

    display:flex;

    gap:12px;

    justify-content:center;

    flex-wrap:wrap;

    padding:
        15px 16px;

    border-top:
        1px solid
        var(--glass-border);

    background:
        var(--glass-strong);

    backdrop-filter:
        blur(20px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(20px)
        saturate(140%);

    box-shadow:
        0 -8px 28px
        rgba(0,0,0,.08);
}


.btn {

    border:none;

    border-radius:999px;

    padding:
        13px 24px;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}


.btn:hover {

    transform:
        translateY(-2px);
}


.btn:active {

    transform:
        scale(.97);
}


.btn-primary {

    background:
        var(--accent);

    color:#fff;

    box-shadow:
        0 8px 20px
        rgba(238,105,131,.22);
}


.btn-secondary {

    background:
        var(--heading);

    color:#fff;

    box-shadow:
        0 8px 20px
        rgba(133,14,53,.17);
}


/* =========================================================
   PAGE FOOTER
========================================================= */

.page-footer {

    padding:
        30px 0
        8px;

    color:
        var(--text-soft);

    text-align:center;

    font-size:14px;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay {

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.50);

    backdrop-filter:
        blur(7px);

    -webkit-backdrop-filter:
        blur(7px);
}


.modal-box {

    width:90%;

    max-width:380px;

    padding:26px;

    border-radius:22px;

    border:
        1px solid
        var(--glass-border);

    background:
        var(--glass-strong);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    box-shadow:
        0 24px 60px
        rgba(0,0,0,.28);
}


.modal-box h3 {

    margin:
        0 0 5px;

    font-size:24px;
}


.modal-box input {

    margin-bottom:12px;
}


.modal-actions {

    display:flex;

    gap:9px;

    justify-content:flex-end;

    margin-top:12px;
}


#resultCardHolder {

    position:fixed;

    left:-9999px;

    top:0;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px) {

    body {
        font-size:16px;
    }


    .wrap {

        padding:
            14px 12px;
    }


    .topbar {

        padding:
            11px 13px;
    }


    .brand {

        font-size:15px;

        line-height:1.25;
    }


    .theme-btn {

        padding:
            8px 12px;

        font-size:14px;
    }


    .header-card {

        padding:
            24px 19px;

        border-radius:20px;
    }


    .header-card h1 {

        font-size:30px;
    }


    .subtitle {

        font-size:15.5px;
    }


    .meta-grid {

        grid-template-columns:1fr;
    }


    .section-shell {

        padding:
            17px 13px;

        border-radius:20px;
    }


    .section-title {

        font-size:24px;
    }


    .section-sub {

        font-size:15px;
    }


    .task {

        padding:
            19px 15px;

        border-radius:17px;
    }


    .task-head h3 {

        font-size:19px;
    }


    .marks-pill {

        font-size:12px;

        padding:
            5px 9px;
    }


    .instruction-box {

        padding:
            12px;
    }


    .instr {

        font-size:15px;
    }


    .freeitem .prompt {

        font-size:15.5px;
    }


    table.qtable {

        display:block;

        overflow-x:auto;

        white-space:normal;

        font-size:14.5px;
    }


    input[type=text],
    select,
    textarea {

        font-size:16px;
    }


    .btn {

        width:100%;

        max-width:420px;

        font-size:15px;
    }

}

</style>

</head>


<body data-theme="light">


<!-- ======================================================
     TOPBAR
====================================================== -->

<div class="topbar">

    <div class="brand">
        বাংলায় IELTS · Grammar Foundation Series
    </div>

    <button
        class="theme-btn"
        onclick="toggleTheme()"
    >
        🌓 Theme
    </button>

</div>


<!-- ======================================================
     MAIN WRAPPER
====================================================== -->

<div class="wrap">


<div class="header-card">

    <h1>
        NOUN — EXTENSIVE WORKSHEET
    </h1>

    <div class="subtitle">
        Section A: Guided (50) + Section B: Independent (50)
        = 100 marks · Homework on Nouns
    </div>


    <div class="meta-grid">

        <div>

            <label>
                Name / নাম
            </label>

            <input
                type="text"
                id="stuName"
                placeholder="তোমার নাম লেখো"
            >

        </div>


        <div>

            <label>
                Batch / ব্যাচ
            </label>

            <input
                type="text"
                id="stuBatch"
                placeholder="ব্যাচ নম্বর"
            >

        </div>


        <div>

            <label>
                Date / তারিখ
            </label>

            <input
                type="date"
                id="stuDate"
            >

        </div>

    </div>

</div>


<div id="renderRoot"></div>


<div
    class="score-banner"
    id="scoreBanner"
    style="display:none;"
>

    <div>
        মোট স্কোর
    </div>

    <div
        class="big"
        id="scoreBig"
    >
        0 / 100
    </div>

    <table
        class="tracker"
        id="trackerTable"
    ></table>

</div>


<div class="page-footer">
    Developed by Abidur Rahman Tahmid
</div>


</div>


<!-- ======================================================
     ACTION BAR
====================================================== -->

<div class="footer-bar">

    <button
        class="btn btn-primary"
        onclick="checkScore()"
    >
        ✅ Check My Score
    </button>


    <button
        class="btn btn-secondary"
        onclick="openSaveModal()"
    >
        🖼️ Save your result as an image
    </button>

</div>


<!-- ======================================================
     SAVE RESULT MODAL
====================================================== -->

<div
    class="modal-overlay"
    id="saveModal"
>

<div class="modal-box">

    <h3>
        Confirm details
    </h3>


    <p
        style="
        font-size:15px;
        color:var(--text-soft);

/* =========================================================
   TASK TYPE ROUTER
========================================================= */

function renderTask(t) {

    if(t.type === 'sort2')
        return renderSort2(t);

    if(t.type === 'fillblank')
        return renderFillblank(t);

    if(t.type === 'fields')
        return renderFields(t);

    if(t.type === 'freetext')
        return renderFreetext(t);

    if(t.type === 'mcq')
        return renderMcq(t);

    if(t.type === 'match')
        return renderMatch(t);

    if(t.type === 'oddone')
        return renderOddone(t);

    if(t.type === 'writeown')
        return renderFreetext(
            t,
            true
        );

    return '';

}

/* =========================================================
   GRADING HELPERS
========================================================= */

function normalize(s) {

    return (s || '')

    .toLowerCase()

    .trim()

    .replace(
        /[.,!?;:'"’‘“”]/g,
        ''
    )

    .replace(
        /\s+/g,
        ' '
    );

}


function similarity(
    user,
    acceptableList
) {

    const u =
    normalize(user);


    if(!u)
        return 0;


    for(
        const a
        of acceptableList
    ) {

        if(
            normalize(a) === u
        )

        return 1;

    }


    let best = 0;


    const uWords =
    new Set(
        u.split(' ')
    );


    acceptableList.forEach(
        a => {


        const aWords =
        new Set(
            normalize(a)
            .split(' ')
        );


        const inter =

        [...uWords]
        .filter(
            w =>
            aWords.has(w)
        )
        .length;


        const union =
        new Set([
            ...uWords,
            ...aWords
        ]).size;


        const j =
        union
        ? inter / union
        : 0;


        if(j > best)
            best = j;

    });


    return best;

}


/* =========================================================
   CHECK SCORE
========================================================= */

let lastResults = null;


function checkScore() {

    let sectionScores = {};

    let total = 0;

    let totalMax = 0;


    SECTIONS.forEach(
        sec => {


        let secScore = 0;

        let secMax = 0;


        sec.tasks.forEach(
            t => {


            const r =
            gradeTask(t);


            secScore +=
            r.score;


            secMax +=
            t.marks;


            const el =
            document.getElementById(
                t.id + '_result'
            );


            const pct =
            t.marks
            ? r.score / t.marks
            : 0;


            const tag =

            pct >= .99
            ? 'tag-full'

            : pct > 0
            ? 'tag-partial'

            : 'tag-zero';


            const tagText =

            pct >= .99
            ? 'সম্পূর্ণ সঠিক'

            : pct > 0
            ? 'আংশিক'

            : 'ভুল/অসম্পূর্ণ';


            el.innerHTML =

            `স্কোর:
            ${round1(r.score)}
            /
            ${t.marks}

            <span
                class="result-tag
                ${tag}"
            >

                ${tagText}

            </span>`;

        });


        sectionScores[
            sec.id
        ] = {

            score:
            secScore,

            max:
            secMax

        };


        total +=
        secScore;


        totalMax +=
        secMax;

    });


    lastResults = {

        sectionScores,

        total,

        totalMax

    };


    /* attempt counter */

    let attempts =

    parseInt(
        localStorage.getItem(
            'noun_ws_attempts'
        ) || '0',
        10
    ) + 1;


    localStorage.setItem(
        'noun_ws_attempts',
        attempts
    );


    document
    .getElementById(
        'scoreBanner'
    )
    .style.display =
    'block';


    document
    .getElementById(
        'scoreBig'
    )
    .textContent =

    `${round1(total)}
    /
    ${totalMax}`;


    renderTracker(
        sectionScores
    );


    document
    .getElementById(
        'scoreBanner'
    )
    .scrollIntoView({

        behavior:
        'smooth'

    });

}


function round1(n) {

    return
    Math.round(
        n * 10
    ) / 10;

}


/* =========================================================
   GRADE EACH TASK
========================================================= */

function gradeTask(t) {

    let score = 0;


    if(
        t.type === 'sort2'
    ) {


        t.items.forEach(
            it => {


            const per =
            t.marks /
            t.items.length;


            if(it.given) {

                score += per;

                return;

            }


            const idx =
            t.items.indexOf(it);


            const sel =
            document.querySelector(

                `input[name="${t.id}_i${idx}"]:checked`

            );


            if(
                sel &&
                sel.value ===
                it.correct
            )

            score += per;

        });

    }


    else if(
        t.type ===
        'fillblank'
    ) {


        t.items.forEach(
            (it,i) => {


            const per =
            t.marks /
            t.items.length;


            if(it.given) {

                score += per;

                return;

            }


            const val =
            document
            .getElementById(
                `${t.id}_i${i}`
            )
            .value;


            score +=

            per *
            similarity(
                val,
                it.correct
            );

        });

    }


    else if(
        t.type ===
        'fields'
    ) {


        t.items.forEach(
            (it,i) => {


            const perItem =
            t.marks /
            t.items.length;


            const perField =
            perItem /
            it.fields.length;


            if(it.given) {

                score +=
                perItem;

                return;

            }


            it.fields.forEach(
                (f,fi) => {


                const name =
                `${t.id}_i${i}_f${fi}`;


                let val = '';


                if(
                    f.type ===
                    'radio'
                ) {


                    const sel =
                    document
                    .querySelector(

                        `input[name="${name}"]:checked`

                    );


                    val =
                    sel
                    ? sel.value
                    : '';

                }


                else if(
                    f.type ===
                    'select'
                ) {


                    const el =
                    document
                    .getElementById(
                        name
                    );


                    val =
                    el
                    ? el.value
                    : '';

                }


                if(

                    val &&

                    val.toLowerCase()
                    ===
                    String(
                        f.correct
                    )
                    .toLowerCase()

                )

                score +=
                perField;

            });

        });

    }


    else if(
        t.type ===
        'freetext'
    ) {


        t.items.forEach(
            (it,i) => {


            const per =
            t.marks /
            t.items.length;


            const val =
            document
            .getElementById(
                `${t.id}_i${i}`
            )
            .value;


            score +=

            per *
            similarity(
                val,
                it.correct
            );

        });

    }


    else if(
        t.type ===
        'mcq'
    ) {


        t.items.forEach(
            (it,i) => {


            const per =
            t.marks /
            t.items.length;


            const sel =
            document
            .querySelector(

                `input[name="${t.id}_i${i}"]:checked`

            );


            if(

                sel &&

                parseInt(
                    sel.value,
                    10
                )
                ===
                it.correct

            )

            score += per;

        });

    }


    else if(
        t.type ===
        'match'
    ) {


        t.items.forEach(
            (it,i) => {


            const per =
            t.marks /
            t.items.length;


            const el =
            document
            .getElementById(
                `${t.id}_i${i}`
            );


            if(

                el &&

                el.value ===
                it.correct

            )

            score += per;

        });

    }


    else if(
        t.type ===
        'oddone'
    ) {


        t.items.forEach(
            (it,i) => {


            const per =
            t.marks /
            t.items.length;


            const sel =
            document
            .querySelector(

                `input[name="${t.id}_i${i}"]:checked`

            );


            if(

                sel &&

                sel.value ===
                it.correct

            )

            score += per;

        });

    }


    else if(
        t.type ===
        'writeown'
    ) {


        t.items.forEach(
            (it,i) => {


            const per =
            t.marks /
            t.items.length;


            const val =
            normalize(

                document
                .getElementById(
                    `${t.id}_i${i}`
                )
                .value

            );


            if(

                val &&

                it.keywords.some(

                    k =>
                    val.includes(
                        k.toLowerCase()
                    )

                )

            )

            score += per;

        });

    }


    return {
        score
    };

}

        h += `

        <tr>

            <td>
                Section ${sec.id}
            </td>

            <td>

                ${round1(
                    s.score
                )}

                /

                ${s.max}

            </td>

        </tr>

        `;

    });


    document
    .getElementById(
        'trackerTable'
    )
    .innerHTML = h;

}


/* =========================================================
   THEME
========================================================= */

function toggleTheme() {

    const body =
    document.body;


    const cur =
    body.getAttribute(
        'data-theme'
    );


    body.setAttribute(

        'data-theme',

        cur === 'light'
        ? 'dark'
        : 'light'

    );

}


/* =========================================================
   SAVE RESULT AS IMAGE
========================================================= */

function openSaveModal() {

    if(!lastResults) {

        alert(
            'আগে "Check My Score" বাটনে ক্লিক করো।'
        );

        return;

    }


    document
    .getElementById(
        'modalName'
    )
    .value =

    document
    .getElementById(
        'stuName'
    )
    .value;


    document
    .getElementById(
        'modalDate'
    )
    .value =

    document
    .getElementById(
        'stuDate'
    )
    .value;


    document
    .getElementById(
        'saveModal'
    )
    .style.display =
    'flex';

}


function closeSaveModal() {

    document
    .getElementById(
        'saveModal'
    )
    .style.display =
    'none';

}

                ></div>


                <div

                    style="
                    font-size:20px;
                    margin-bottom:8px;

                    "

                >

                    Attempts made:

                    <b>
                        ${attempts}

                </div>


                <div

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(s) {

    const d =
    document
    .createElement(
        'div'
    );


    d.textContent = s;


    return d.innerHTML;

}
